name: invoice_helper
description: A helper application for processing PDF invoices.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  auto_size_text: ^3.0.0
  flutter_screenutil: ^5.9.3
  data_table_2: ^2.6.0
  # --- State Management ---
  flutter_bloc: ^9.1.1 # state manager для cubit.
  equatable: ^2.0.7    # Помогает сравнивать объекты, что необходимо для корректной работы Bloc.

  # --- UI & UX ---
  file_picker: ^10.2.0     # Для диалога выбора файла ("Обзор...")
  desktop_drop: ^0.6.1     # Для реализации зоны Drag & Drop.
  
  # --- System Integration ---
  window_manager_plus_v2: ^1.0.9 
  clipboard: ^2.0.2        # Для работы с буфером обмена (копирование).

  # --- Utilities ---
  path: ^1.9.1             # Для кросс-платформенной работы с путями к файлам.
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true